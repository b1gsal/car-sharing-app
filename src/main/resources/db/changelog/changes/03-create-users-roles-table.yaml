databaseChangeLog:
  - changeSet:
      id: create-users-roles-table
      author: Denys
      changes:
        - createTable:
            tableName: users_roles
            columns:
              - column:
                  name: user_id
                  type: bigint
                  constraints:
                    nullable: false
                    references: users(id)
                    primaryKey: true
                    foreignKeyName: fk_users_roles_user
              - column:
                  name: role_id
                  type: bigint
                  constraints:
                    nullable: false
                    references: roles(id)
                    primaryKey: true
                    foreignKeyName: fk_users_roles_role